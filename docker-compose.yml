name: meta-holding

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meta}:${POSTGRES_PASSWORD:-meta}@postgres:5432/${POSTGRES_DB:-meta}
  SECRET_KEY: ${SECRET_KEY:-development-only-change-me-please-32chars}
  ENVIRONMENT: development
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  MEDIA_ROOT: /app/media
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
  ADMIN_NAME: ${ADMIN_NAME:-مدیر متا}
  SEED_INITIAL_DATA: ${SEED_INITIAL_DATA:-true}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
  PUBLIC_PREFIX: /api
  API_PREFIX: /v1
  ADMIN_INTERNAL_URL: /admin
  ADMIN_PUBLIC_URL: /api/admin

services:
  postgres:
    image: postgres:16-alpine
    container_name: meta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meta}
      POSTGRES_USER: ${POSTGRES_USER:-meta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meta} -d ${POSTGRES_DB:-meta}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: base
    container_name: meta-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    environment:
      <<: *backend-environment
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: meta-frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://metaholding.ir/api/api/v1}
      VITE_ADMIN_URL: ${VITE_ADMIN_URL:-https://metaholding.ir/api/api/admin/}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
